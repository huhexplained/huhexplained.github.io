<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD60A"/>
      <stop offset="0.55" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#FF2E63"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A2CFF"/>
      <stop offset="1" stop-color="#3A0CA3"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- "huh!" spark lines -->
  <g stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" opacity="0.95">
    <line x1="742" y1="196" x2="800" y2="128"/>
    <line x1="808" y1="276" x2="894" y2="248"/>
    <line x1="660" y1="160" x2="668" y2="76"/>
  </g>

  <!-- speech bubble -->
  <g transform="rotate(-6 512 520)">
    <path d="M512 214
             C700 214 838 330 838 488
             C838 646 700 762 512 762
             C478 762 446 758 416 751
             L262 846
             L300 712
             C226 662 186 582 186 488
             C186 330 324 214 512 214 Z"
          fill="#FFFFFF"/>

    <!-- curly question mark built from shapes -->
    <path d="M418 410
             C418 344 462 304 520 304
             C584 304 626 344 626 398
             C626 446 596 470 562 490
             C538 504 526 518 526 548
             L526 568"
          fill="none" stroke="url(#mark)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="526" cy="652" r="40" fill="url(#mark)"/>
  </g>
</svg>
